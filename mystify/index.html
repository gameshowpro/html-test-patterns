<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mystify</title>
    <link rel="stylesheet" href="../cef-overlay.css">
    <style>
        body {
            background-color: transparent !important;
            margin: 0;
            overflow: hidden;
        }
        canvas {
            width: 100vw;
            height: 100vh;
            display: block;
            background: transparent !important;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        // Vertex class
        class Point {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                // Random speeds
                this.vx = (Math.random() * 2 + 1) * (Math.random() < 0.5 ? 1 : -1);
                this.vy = (Math.random() * 2 + 1) * (Math.random() < 0.5 ? 1 : -1);
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;

                // Bounce off edges
                if (this.x <= 0) {
                    this.x = 0;
                    this.vx *= -1;
                } else if (this.x >= width) {
                    this.x = width;
                    this.vx *= -1;
                }

                if (this.y <= 0) {
                    this.y = 0;
                    this.vy *= -1;
                } else if (this.y >= height) {
                    this.y = height;
                    this.vy *= -1;
                }
            }
        }

        // Polygon class
        class Shape {
            constructor(vertexCount, colorHue) {
                this.points = [];
                for (let i = 0; i < vertexCount; i++) {
                    this.points.push(new Point());
                }
                this.history = [];
                this.maxHistory = 12; // Length of the trail
                this.hue = colorHue;
            }

            update() {
                // Save current state to history
                const state = this.points.map(p => ({ x: p.x, y: p.y }));
                this.history.unshift(state);
                if (this.history.length > this.maxHistory) {
                    this.history.pop();
                }

                // Update point positions
                this.points.forEach(p => p.update());

                // Cycle color hue
                this.hue = (this.hue + 0.15) % 360;
            }

            draw() {
                // Draw trails in reverse order (oldest first, so newest is drawn on top)
                for (let i = this.history.length - 1; i >= 0; i--) {
                    const state = this.history[i];
                    const progress = 1 - (i / this.history.length); // opacity
                    
                    ctx.beginPath();
                    ctx.moveTo(state[0].x, state[0].y);
                    for (let j = 1; j < state.length; j++) {
                        ctx.lineTo(state[j].x, state[j].y);
                    }
                    ctx.closePath();

                    // Performant glow emulation (thick soft line + thin bright line)
                    ctx.strokeStyle = `hsla(${(this.hue + i * 2) % 360}, 100%, 65%, ${progress * 0.15})`;
                    ctx.lineWidth = 6;
                    ctx.stroke();

                    ctx.strokeStyle = `hsla(${(this.hue + i * 2) % 360}, 100%, 65%, ${progress * 0.8})`;
                    ctx.lineWidth = 2;
                    ctx.stroke();
                }
            }
        }

        // Create bouncing polygons (e.g. 2 shapes, each with 4 vertices)
        const shapes = [
            new Shape(4, 0),    // Shape 1 starting with Red hue
            new Shape(4, 180)   // Shape 2 starting with Cyan hue
        ];

        function animate() {
            // Clear canvas with transparent pixels
            ctx.clearRect(0, 0, width, height);

            shapes.forEach(shape => {
                shape.update();
                shape.draw();
            });

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
